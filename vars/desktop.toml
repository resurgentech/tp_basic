# Development desktop: `tp-basic run dev_desktop --vars vars/desktop.toml`.
# Mirrors inventories/group_vars/all for the roles dev_desktop applies.
admin_users = ["bot", "tpdev"]
rustc_version = "1.94.0"

# A crypt(3) hash for accounts the run creates. This file is tracked, so it
# holds no literal (an empty one still counts). To set one, copy this file
# outside the repo and add a reference, then pass that copy with `--vars`
# (one --vars file per run; it replaces this one whole):
#   default_password = { env = "TP_PW_HASH" }
