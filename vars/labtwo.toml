# The labtwo playbook: `tp-basic run labtwo --inventory inventories/<file>.toml
# --vars vars/labtwo.toml`. The non-secret values the labtwo roles read, from
# `inventories/group_vars/all` of the Ansible repo.
#
# The Ansible inventory logs in as `ubuntu` (`admin_users` there is
# `["{{ ansible_user }}"]`).
admin_users = ["ubuntu"]
iana_tz = "America/Los_Angeles"
# `rustup_version` 1.29.0 and `cargo_version` 1.94.0 of group_vars/all pinned
# nothing and no longer exist as vars; `rustc_version` is the one kept.
rustc_version = "1.94.0"

# `default_password` is unset (user ruling, 2026-11-18): an account a run
# creates stays locked, as the Ansible role's empty default left it, and a
# labtwo run reads no secret store. To set one, use a reference, never a
# value: `default_password = { bao = "<path>", field = "<field>" }`.
