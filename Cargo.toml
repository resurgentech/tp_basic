[package]
name = "tp-basic"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Playbooks and roles for resurgentech hosts and images, on telepatch"
publish = false

[[bin]]
name = "tp-basic"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[workspace]

[dependencies]
telepatch = { git = "https://github.com/resurgentech/telepatch.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
insta = "1"

# Local work builds against the sibling checkout; drop this block (or
# `cargo build` without it) to build from the pushed telepatch.
[patch."https://github.com/resurgentech/telepatch.git"]
telepatch = { path = "../telepatch/crates/telepatch" }
telepatch-macros = { path = "../telepatch/crates/telepatch-macros" }

[profile.release]
strip = true
